<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Web Page</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="FS_Prog71.css">
</head>
<body>

    <div class="container">
        <h1>Dynamic Dashboard</h1>
        
        <div class="controls">
            <button id="themeToggle">Toggle Dark Mode</button>
            <button id="fetchDataBtn">Load API Data</button>
        </div>

        <div class="controls">
            <input type="text" id="itemInput" placeholder="Enter a new item...">
            <button id="addItemBtn">Add Item</button>
        </div>

        <ul id="dynamicList">
            <!-- JavaScript will insert items here dynamically -->
        </ul>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="FS_Prog72.js"></script>
</body>
</html>
